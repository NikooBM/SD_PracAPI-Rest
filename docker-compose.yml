# Docker Compose para EVCharging — Release 2
networks:
  evcharging:
    driver: bridge
    name: evcharging_net

volumes:
  db_data:        # BD compartida entre central, api_central y registry
  audit_data:     # Logs de auditoría
  registry_certs: # Certificado TLS del Registry (compartido con central)
  # En despliegue distribuido (CPs en otro PC) se usa un bind-mount local
  # o se pasan las IPs correctas; en despliegue local este volumen es suficiente
  cp_data:

services:
  # ───────────────────────────────────────────────────────────────────
  # INFRAESTRUCTURA BASE
  # ───────────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [evcharging]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [evcharging]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # En local: KAFKA_EXTERNAL_IP=localhost (valor por defecto).
      # En distribuido: export KAFKA_EXTERNAL_IP=<IP_PC1> antes de docker compose up.
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_IP:-localhost}:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server=localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks: [evcharging]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo '⏳ Esperando Kafka...'; sleep 10;
        for topic in service_requests service_authorizations charging_data \
                     charging_complete driver_notifications central_commands \
                     weather_sync; do
          kafka-topics --create --if-not-exists \
            --bootstrap-server kafka:29092 \
            --topic $$topic --partitions 1 --replication-factor 1;
          echo "✅ Topic: $$topic";
        done;
        echo '✅ Todos los topics creados';

  # ───────────────────────────────────────────────────────────────────
  # IMAGEN DE APLICACIÓN (build único, usada por todos los servicios Python)
  # ───────────────────────────────────────────────────────────────────

  app-build:
    build: .
    image: evcharging-app:latest
    container_name: evcharging-build
    command: echo "✅ Imagen evcharging-app construida"
    networks: [evcharging]

  # ───────────────────────────────────────────────────────────────────
  # CENTRAL
  # ───────────────────────────────────────────────────────────────────

  central:
    image: evcharging-app:latest
    container_name: ev_central
    networks: [evcharging]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      registry:
        condition: service_started
      app-build:
        condition: service_completed_successfully
    ports:
      - "5001:5001"
    volumes:
      - ./central:/app/central:ro
      - ./security:/app/security:ro
      - db_data:/app/data
      - audit_data:/app/audit
      - registry_certs:/app/certs:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      SOCKET_PORT: 5001
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_PATH: /app/data/evcharging.db
      AUDIT_LOG: /app/audit/audit.log
      REGISTRY_URL: https://ev_registry:8443
      REGISTRY_CERT_PATH: /app/certs/registry.crt
      CP_DATA_DIR: /app/data/cp_credentials
      MACHINE_SECRET: ${MACHINE_SECRET:?MACHINE_SECRET debe estar en .env}
      DISPLAY: ${DISPLAY:-:0}
      LOG_LEVEL: INFO
    command: python central/ev_central.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.create_connection(('localhost',5001),2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ───────────────────────────────────────────────────────────────────
  # REGISTRY
  # ───────────────────────────────────────────────────────────────────

  registry:
    image: evcharging-app:latest
    container_name: ev_registry
    networks: [evcharging]
    depends_on:
      app-build:
        condition: service_completed_successfully
    ports:
      - "8443:8443"
    volumes:
      - ./registry:/app/registry:ro
      - ./security:/app/security:ro
      - db_data:/app/data
      - registry_certs:/app/data/certs  # cert generado aquí, compartido con central
    environment:
      REGISTRY_PORT: 8443
      DB_PATH: /app/data/registry.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY debe estar en .env}
      REGISTRY_ADMIN_KEY: ${REGISTRY_ADMIN_KEY:-admin-key-change-in-production}
      REGISTRY_DATA_DIR: /app/data/certs
      LOG_LEVEL: INFO
    command: python registry/ev_registry.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ───────────────────────────────────────────────────────────────────
  # API_CENTRAL
  # ───────────────────────────────────────────────────────────────────

  api_central:
    image: evcharging-app:latest
    container_name: api_central
    networks: [evcharging]
    depends_on:
      kafka:
        condition: service_healthy
      app-build:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    volumes:
      - ./api_central:/app/api_central:ro
      - ./security:/app/security:ro
      - db_data:/app/data
      - audit_data:/app/audit
    environment:
      API_PORT: 8082
      DB_PATH: /app/data/evcharging.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUDIT_LOG: /app/audit/audit.log
      WEATHER_API_KEY: ${WEATHER_API_KEY:-weather-api-key-change-in-production}
      LOG_LEVEL: INFO
    command: python api_central/api_central.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ───────────────────────────────────────────────────────────────────
  # WEATHER
  # ───────────────────────────────────────────────────────────────────

  weather:
    image: evcharging-app:latest
    container_name: ev_w
    networks: [evcharging]
    depends_on:
      api_central:
        condition: service_started
      app-build:
        condition: service_completed_successfully
    volumes:
      - ./weather:/app/weather:rw   # rw: guarda locations.json
      - ./security:/app/security:ro
    environment:
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?OPENWEATHER_API_KEY debe estar en .env}
      CENTRAL_API_URL: http://api_central:8082
      CHECK_INTERVAL: 4
      WEATHER_API_KEY: ${WEATHER_API_KEY:-weather-api-key-change-in-production}
      WEATHER_LOCATIONS_FILE: /app/weather/locations.json
      LOG_LEVEL: INFO
    stdin_open: true
    tty: true
    restart: on-failure
    command: python weather/ev_w.py

  # ───────────────────────────────────────────────────────────────────
  # FRONT (nginx sirviendo index.html estático)
  # ───────────────────────────────────────────────────────────────────

  front:
    image: nginx:alpine
    container_name: ev_front
    networks: [evcharging]
    depends_on:
      - api_central
    ports:
      - "80:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro
    restart: unless-stopped
